# ─────────────────────────────────────────────────────────────────────────────
#  Радиальное меню — профиль «Навигация» (вызывается своей кнопкой/сочетанием из «Настроек»)
#
#  Жесты в четыре стороны: влево / вправо — «назад» / «вперёд» в окне под указателем, вверх — скриншот
#  области (если задержаться — скриншот окна под указателем), вниз — веер из двух кнопок: рабочий стол
#  назад / вперёд (на первом и последнем столе соответствующая кнопка приглушена: enabled_if).
#
#  Формат файла и список значков — в menu.yaml рядом (в начале файла).
# ─────────────────────────────────────────────────────────────────────────────

layout:
  start: top          # первая кнопка сверху, дальше по часовой: справа, снизу, слева

menu:
  - label: Скриншот
    icon: crop
    keys: win+shift+s
    dwell: true
    items:
      - { label: Скриншот окна, icon: window, action: screenshot-window }
  - { label: Вперёд, icon: arrow-right, action: forward }
  - label: Рабочие столы
    icon: desktops
    items:
      - { label: Стол назад, icon: desktop-prev, keys: ctrl+win+left, enabled_if: desktop-prev }
      - { label: Стол вперёд, icon: desktop-next, keys: ctrl+win+right, enabled_if: desktop-next }
  - { label: Назад, icon: arrow-left, action: back }
