[package]
name = "radial_menu"
version = "0.8.0"
edition = "2021"
description = "Радиальное меню на боковой кнопке мыши (Windows)"
license = "MIT"

[lib]
name = "radial_menu"
path = "src/lib.rs"

[[bin]]
name = "RadialMenu"
path = "src/main.rs"

[dependencies]
tiny-skia = { version = "0.11", default-features = false, features = ["std"] }
svgtypes = "0.15"
png = "0.17"
fontdue = { version = "0.9", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.10"
serde_json = "1"
sha2 = "0.10"
resvg = { version = "0.45", default-features = false }

[target.'cfg(windows)'.dependencies.windows]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Media",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_UI_Controls",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Xps",
    "Win32_Networking_WinHttp",
    "Media_Control",
    "Foundation",
    "Win32_System_ProcessStatus",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_Security",
]

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "z" # размер: ядро рисования ниже ускорено отдельно
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Горячий путь (растеризация кадра) — на скорость, всё остальное — на размер.
[profile.release.package.tiny-skia]
opt-level = 3
[profile.release.package.tiny-skia-path]
opt-level = 3
[profile.release.package.radial_menu]
opt-level = 3

# fontdue с небольшой правкой: загружать только нужные диапазоны символов (экономит ~17 МБ на шрифт)
[patch.crates-io]
fontdue = { path = "vendor/fontdue" }
